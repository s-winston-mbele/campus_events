name: campus_events
description: Premium campus events UI.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Display
      fonts:
        - asset: assets/fonts/Display.ttf
          weight: 700
    - family: Modern
      fonts:
        - asset: assets/fonts/Modern.ttf
        - asset: assets/fonts/Modern-Bold.ttf
          weight: 700
